name: Pages

# The site is built from the README.md and DESIGN.md of the packages, roadmap.md and site/, for dev (main) and for each
# release tag. A pull request only builds it; main also deploys it (Settings > Pages > Source must be "GitHub Actions").
# A tag push does not start it: after tagging, run it on main by hand (the ml-release skill).
on:
  pull_request:
    paths:
      - '*/README.md'
      - '*/DESIGN.md'
      - 'roadmap.md'
      - 'site/**'
      - '.gitmodules'
      - 'Makefile'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - '*/README.md'
      - '*/DESIGN.md'
      - 'roadmap.md'
      - 'site/**'
      - '.gitmodules'
      - 'Makefile'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The pins of Hugo (the extended archive) and Dart Sass. The docs theme's tools/site_versions.py downloads them,
    # checks the hashes, and builds dev and every release with them (a tag has its own copy of this file, which the
    # script ignores for the tags that use the theme); keep the four names and the one-line form. Keep them equal to
    # the pins of agentica-lang/docs-theme's .github/workflows/ci.yml.
    env:
      HUGO_VERSION: 0.167.0
      HUGO_SHA256: 0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957
      DART_SASS_VERSION: 1.105.1
      DART_SASS_SHA256: 9046fdd4a31a524a0020298c55d9e155d4c22363ef268e8992574335a72c6a6f
    steps:
      # Full history and tags: every release is built from its own tree (a git worktree, whose history dates the pages).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The docs theme only (the other submodules are native sources), with its history, so that its script can unpack
      # the theme commit this checkout pins into every tag.
      - run: git submodule update --init site/themes/docs-theme
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/themes/docs-theme/highlight/package-lock.json
      - id: pages
        uses: actions/configure-pages@v6
      # The cache holds the output of each release by commit sha and base URL (a sha never changes, so an entry is
      # never wrong). Each run restores the newest entry of the script's version. Only a run that is not a pull request
      # and built something new saves one (also after a failed build, so the releases that did build are kept); the
      # script prunes the folder to the current builds first.
      - uses: actions/cache/restore@v5
        with:
          path: build/site-versions/cache
          key: site-versions-${{ hashFiles('site/themes/docs-theme/tools/site_versions.py') }}-${{ github.run_id }}
          restore-keys: |
            site-versions-${{ hashFiles('site/themes/docs-theme/tools/site_versions.py') }}-
      # A release is the tag tensor-X.Y.Z: all the packages are released together, at the same commit.
      - id: build
        run: >-
          python3 -I site/themes/docs-theme/tools/site_versions.py build
          --base-url "${{ steps.pages.outputs.base_url }}/"
          --tag-pattern '^tensor-(\d+\.\d+\.\d+)$'
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.build.outputs.fresh == 'true' }}
        with:
          path: build/site-versions/cache
          key: site-versions-${{ hashFiles('site/themes/docs-theme/tools/site_versions.py') }}-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site-versions/public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
