name: CI

# One folder per Agentica package, each with its own agentica.toml and
# AGENTICA_VERSION. The plan job lists the package folders so the packages
# job runs as a matrix: adding a folder adds it to CI with no edit here.
# Models and weights never enter git: tests use synthetic fixtures, and a
# package that needs a model downloads its pinned one explicitly (see the
# engine/model steps of the packages job).
# A change to docs alone (Markdown, site/) runs no CI: the Pages workflow
# builds the site.
# Every runner is pinned to Ubuntu 26.04, x86_64 and arm64 alike, never to
# ubuntu-latest: the images are reproducible, the arm and x86 jobs see the same
# distribution, and libtorch-dev exists only from 25.04 (26.04 here).
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'site/**']
  pull_request:
    paths-ignore: ['**/*.md', 'site/**']

permissions:
  contents: read

# A new push to a pull request cancels its older run; a push to main gets a
# group of its own, so it is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The native-gen release that regenerates and checks the native headers.
  NATIVE_GEN_TAG: native-gen-0.5.0

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      xla: ${{ steps.plan.outputs.xla }}
      torch: ${{ steps.plan.outputs.torch }}
      ggml_arm64: ${{ steps.plan.outputs.ggml_arm64 }}
      vulkan: ${{ steps.plan.outputs.vulkan }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Third-party engines (whisper.cpp and friends) enter as submodules,
          # never vendored; tests must run against the pinned commits.
          submodules: recursive
          # The plan step compares the merge commit of a pull request with its first parent, the base.
          fetch-depth: 2

      - name: Test the plan
        run: python3 -m unittest tools/plan_test.py tools/check_guide_test.py

      # A push to main runs every package. A pull request runs the packages it changes and those that depend on them
      # (the agentica.toml files tell which), and the extra jobs whose packages are among them; a change outside every
      # package folder runs everything. The step compares the merge commit of the pull request with its first parent,
      # the base (tools/plan.py).
      - name: Plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only HEAD^1 HEAD || true)
          printf '%s\n' "$files" | python3 tools/plan.py "${{ github.event_name }}" | tee -a "$GITHUB_OUTPUT"

  # Each package on its pinned Agentica release: install, check, format, the
  # --check of its generated native headers, and its tests.
  packages:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    name: ${{ matrix.package }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Read the pinned Agentica version
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          read -r version sha256 _ < AGENTICA_VERSION
          [ -n "$version" ] && [ -n "$sha256" ] || {
            echo "AGENTICA_VERSION must hold the version and the sha256 of its linux-x86_64 archive" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ steps.pin.outputs.version }}
          sha256: ${{ steps.pin.outputs.sha256 }}

      # vision/ links libvips: the image package builds its C module against it on the first use.
      - name: Install libvips
        if: matrix.package == 'vision'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev

      # The default build of the optional torch module (a C compiler, no libtorch) must say why it stops, and show no
      # error of its own (ml#379: pread and O_CLOEXEC of float_file.h).
      - name: The torch module names a missing libtorch
        if: matrix.package == 'tensor'
        shell: bash
        run: |
          out=$(env -u CC cc -c -o /dev/null native/torch.c 2>&1 || true)
          echo "$out"
          grep -q "no libtorch found" <<<"$out"
          ! grep -Eq "pread|O_CLOEXEC|ftruncate" <<<"$out"

      # tensor/tools/build-engine.sh keeps ggml outside the checkout, in
      # ~/.cache/agentica-ml, under a key of its own (commit, flags,
      # compiler). This step restores that folder, keyed by the ggml commit
      # and the script, so a run that changes neither compiles nothing.
      - name: Name the engine pin
        id: engine-pin
        shell: bash
        run: |
          mkdir -p ~/.cache/agentica-ml
          echo "ggml=$(git rev-parse HEAD:third_party/ggml)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/agentica-ml
          key: engine-${{ matrix.package }}-${{ steps.engine-pin.outputs.ggml }}-${{ hashFiles('tensor/tools/build-engine.sh') }}

      # A package with tools/build-engine.sh links a pinned third-party
      # engine (a submodule at the repository root, never vendored); the
      # script builds it and prints the include/library exports. This runs
      # before `agentica install` because installing already compiles the
      # native module, which needs the engine headers and libraries. A
      # package without the script skips this step, so adding a folder adds
      # it to CI with no edit here.
      - name: Build the pinned third-party engine
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/build-engine.sh ]; then
            echo "no tools/build-engine.sh: nothing to build"
            exit 0
          fi
          exports=$(sh tools/build-engine.sh | grep '^export ') || true
          [ -n "$exports" ] || {
            echo "tools/build-engine.sh printed no export lines" >&2
            exit 1
          }
          eval "$exports"
          echo "C_INCLUDE_PATH=$C_INCLUDE_PATH" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$LIBRARY_PATH" >> "$GITHUB_ENV"

      # A package with no dependencies has no lock and nothing to fetch.
      - name: Install the locked dependencies
        shell: bash
        run: |
          if [ -f agentica.lock ]; then agentica install; else echo "no agentica.lock: nothing to fetch"; fi

      - name: Check
        run: agentica check

      - name: Format
        run: agentica fmt --check

      # Every committed native/*_native.h must be the header that native-gen
      # makes from the tracked .agc that declares its `extern module` (any
      # folder layout); a package with no generated headers skips this step,
      # so adding a folder adds it to CI with no edit here. The clone of the
      # native-gen release is shallow, at the tag.
      - name: Check the generated native headers
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          headers=(native/*_native.h)
          if [ "${#headers[@]}" -eq 0 ]; then
            echo "no generated native headers: nothing to check"
            exit 0
          fi
          git clone --depth 1 --branch "$NATIVE_GEN_TAG" \
            https://github.com/agentica-lang/packages.git "$RUNNER_TEMP/packages"
          for h in "${headers[@]}"; do
            name=${h#native/}
            name=${name%_native.h}
            src=$(git grep -l -F "extern module \"$name\"" -- '*.agc' | head -n 1 || true)
            [ -n "$src" ] || {
              echo "no tracked .agc declares extern module \"$name\"" >&2
              exit 1
            }
            agentica "$RUNNER_TEMP/packages/native-gen/cli.agc" "$src" \
              --output "$h" --check
          done

      - name: Test
        # A test file gets 10M x (its tests + 1) steps (the default is 1M x):
        # the gradient checks of nn/ need about 4.2M (measured by bisection).
        # The 10x loosens the runaway guard for every member; that is fine
        # here, because the guard only catches an infinite loop, which still
        # ends, and the job has its own timeout-minutes.
        # TENSOR_REQUIRE_GGML: tensor/, nn/, train/, asr/, transformers/, hub/ and vision/ build ggml in the
        # engine step, so a ggml module that did not build fails their tests
        # instead of passing them through the absent path.
        env:
          TENSOR_REQUIRE_GGML: ${{ contains(fromJSON('["tensor", "nn", "train", "asr", "transformers", "hub", "vision"]'), matrix.package) && '1' || '' }}
        run: agentica test --coverage --max-steps 10000000

      - name: The guide shows its program
        if: matrix.package == 'transformers'
        run: python3 ../tools/check_guide.py ../site/content/train/finetune-minilm.md tools/finetune_stsb.agc

      # The line coverage of the Test step: at least FLOOR percent (tools/coverage_check.py, where the floor and the
      # files that CI cannot run are) of the package's own lines. The report is kept as an artifact, with no external
      # service.
      - name: Coverage
        run: python3 ../tools/coverage_check.py coverage/lcov.info --package ${{ matrix.package }}

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-${{ matrix.package }}
          path: ${{ matrix.package }}/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      # A package with a long/ folder runs its long-input tests here, with a
      # budget of their own: transformers/long/ sends 200k characters through
      # the tokenizers (the heaviest test about 580 M VM steps, the file 1.33 G;
      # a file gets the budget times its tests plus one).
      - name: Long-input tests
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d long ]; then
            echo "no long/: nothing to run"
            exit 0
          fi
          agentica test --max-steps 400000000 long/

      # The round-trip tests of tensor/ (from_file) again, with the weights read
      # in Agentica (TENSOR_LOAD=agentica: File.seek and File.read_bytes, then
      # the native from_bytes) in place of the native pread.
      - name: Test the Agentica read path of from_file
        if: matrix.package == 'tensor'
        env:
          TENSOR_LOAD: agentica
          TENSOR_REQUIRE_GGML: '1'
        run: agentica test --max-steps 10000000 test/from_file_test.agc test/xla_bf16_test.agc

      # A package with tools/fetch-model.sh validates against the pinned
      # models it downloads (weights never enter git); the script checks every
      # sha256 and fetches all of them when given no names. This runs after
      # `agentica test`, so the offline suite proves it needs no model (the
      # tests use no network either; the steps before it do clone). A package
      # without the script skips this step.
      - name: Download the pinned test models
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/fetch-model.sh ]; then
            echo "no tools/fetch-model.sh: nothing to fetch"
            exit 0
          fi
          sh tools/fetch-model.sh models

      # The live layer needs the built engine and the downloaded models from
      # the steps above: the runner checks plus one program per transcription
      # case, live/transcribe_*.agc (decoding a full sample costs more steps
      # than one test file may spend; runs are not step-capped). It runs
      # whenever the package has a live/ folder (runner checks and the
      # programs are independent: one may exist without the other).
      - name: Live transcription
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d live ]; then
            echo "no live/: nothing to run"
            exit 0
          fi
          shopt -s nullglob
          checks=(live/*_test.agc live/*.feature)
          [ "${#checks[@]}" -eq 0 ] || agentica test live/
          programs=(live/transcribe_*.agc)
          [ "${#programs[@]}" -gt 0 ] || echo "no live/transcribe_*.agc: program checks skipped"
          for program in "${programs[@]}"; do
            echo "$program"
            agentica "$program"
          done

  # cchecker over the native C (tensor/, whisper/, asr/): the project rules for locks and ownership, gcc -fanalyzer and
  # clang-tidy, against cchecker-baseline.json. A new finding, a stale ignore or a tool error fails it. The analyzers
  # word their messages differently between versions and the baseline matches by message, so it runs gcc 14 and
  # clang 19, the versions of the baseline. Only the headers of the submodules are read: no engine is built.
  cchecker:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Read the pinned Agentica version
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          read -r version sha256 _ < tensor/AGENTICA_VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ steps.pin.outputs.version }}
          sha256: ${{ steps.pin.outputs.sha256 }}

      - name: gcc 14, clang 19 and clang-tidy 19
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-14 clang-19 clang-tidy-19

      - name: make cchecker
        run: make cchecker CCHECKER_FLAGS="--gcc gcc-14 --clang clang-19 --clang-tidy clang-tidy-19 --strict-baseline"

  # The XLA backend of tensor/ (Backend.Xla) on the pinned PJRT CPU plugin, in parallel with the packages. The plugin
  # is the Linux x86_64 build in our release xla-<commit> (the XLA plugin workflow) that tools/install_xla.agc
  # downloads and checks by its sha256; the cache keeps the plugin, keyed by the file that pins it (src/xla.agc), so a
  # run downloads it only when that file changes.
  xla:
    needs: plan
    if: needs.plan.outputs.xla == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      AGENTICA_ML_CACHE: /home/runner/.cache/agentica-ml
    defaults:
      run:
        working-directory: tensor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the pinned Agentica version
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          read -r version sha256 _ < AGENTICA_VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ steps.pin.outputs.version }}
          sha256: ${{ steps.pin.outputs.sha256 }}

      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: /home/runner/.cache/agentica-ml/xla
          key: xla-plugin-${{ hashFiles('tensor/src/xla.agc') }}

      - name: Install the locked dependencies
        run: agentica install

      - name: Install the XLA plugin
        run: agentica tools/install_xla.agc

      - name: Test
        env:
          TENSOR_REQUIRE_XLA: '1'
        run: agentica test --max-steps 10000000 test/xla_test.agc test/xla_ops_test.agc test/xla_half_test.agc test/xla_bf16_test.agc test/xla_missing_test.agc test/from_file_test.agc

      - name: Test the Agentica read path of from_file on XLA
        env:
          TENSOR_LOAD: agentica
          TENSOR_REQUIRE_XLA: '1'
        run: agentica test --max-steps 10000000 test/from_file_test.agc test/xla_half_test.agc test/xla_bf16_test.agc

      # Train.fit on XLA: the fits that follow the reference and PyTorch's goldens. train/ reads tensor/ from the
      # workspace, so it needs no install of its own beyond its locked dependencies.
      - name: Install the locked dependencies of train
        working-directory: train
        run: agentica install

      - name: Test train on XLA
        working-directory: train
        env:
          TENSOR_REQUIRE_XLA: '1'
        run: agentica test --max-steps 10000000 test/fit_test.agc test/schedule_test.agc test/adamw_test.agc test/loop_test.agc test/resume_test.agc test/checkpoint_test.agc

      # Qwen3 generation on XLA: the steps of a cache against the forward, and the greedy ids (the peer is Python's
      # standard library). transformers/ reads tensor/ from the workspace.
      - name: Install the locked dependencies of transformers
        working-directory: transformers
        run: agentica install

      - name: Test transformers on XLA
        working-directory: transformers
        env:
          TENSOR_REQUIRE_XLA: '1'
        run: agentica test --max-steps 200000000 --only xla test/generate_test.agc test/bert_weights_test.agc

      - name: Test Qwen3 F16 weights on XLA
        working-directory: transformers
        env:
          TENSOR_REQUIRE_XLA: '1'
        run: agentica test --max-steps 200000000 --only "f16 weights" test/qwen3_test.agc

      - name: Test Qwen3 BF16 weights on XLA
        working-directory: transformers
        env:
          TENSOR_REQUIRE_XLA: '1'
        run: agentica test --max-steps 200000000 --only "bf16 weights" test/qwen3_test.agc

  # The libtorch backend of tensor/ (Backend.Torch) on Ubuntu's own libtorch-dev, the system package: the repository never
  # downloads or vendors libtorch. tools/build-torch.sh finds it, `agentica install` builds the optional native module,
  # and TENSOR_REQUIRE_TORCH=1 makes a module that did not build fail the torch tests instead of passing them as absent.
  # The whole tensor suite runs, since much of it also compares against libtorch; coverage_check.py counts the torch
  # files of this report (src/torch.agc and the others that the packages job cannot run). Same rule as the xla job.
  torch:
    needs: plan
    if: needs.plan.outputs.torch == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tensor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the pinned Agentica version
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          read -r version sha256 _ < AGENTICA_VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ steps.pin.outputs.version }}
          sha256: ${{ steps.pin.outputs.sha256 }}

      - name: Install libtorch
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtorch-dev
          dpkg-query -W -f='libtorch-dev ${Version}\n' libtorch-dev

      # The build needs g++ and libtorch's headers: build-torch.sh prints the exports for them.
      - name: Find libtorch
        shell: bash
        run: |
          set -euo pipefail
          exports=$(sh tools/build-torch.sh | grep '^export ')
          eval "$exports"
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$CPLUS_INCLUDE_PATH" >> "$GITHUB_ENV"

      - name: Install the locked dependencies
        run: agentica install

      - name: Test
        env:
          TENSOR_REQUIRE_TORCH: '1'
        run: agentica test --coverage --max-steps 10000000

      - name: Test the Agentica read path of BF16 on libtorch
        env:
          TENSOR_LOAD: agentica
          TENSOR_REQUIRE_TORCH: '1'
        run: agentica test --max-steps 10000000 test/xla_bf16_test.agc

      # The gradients of DistilBERT and BERT on libtorch (the attention backward needs batch_matmul), and a few
      # training steps of each. transformers/ reads tensor/ from the workspace.
      - name: Install the locked dependencies of transformers
        working-directory: transformers
        run: agentica install

      - name: Test transformers on libtorch
        working-directory: transformers
        env:
          TENSOR_REQUIRE_TORCH: '1'
        run: agentica test --max-steps 10000000 test/distilbert_weights_test.agc test/bert_weights_test.agc

      - name: Test Qwen3 BF16 weights on Torch
        working-directory: transformers
        env:
          TENSOR_REQUIRE_TORCH: '1'
        run: agentica test --max-steps 200000000 --only "bf16 weights" test/qwen3_test.agc

      - name: Coverage of the torch files
        run: python3 ../tools/coverage_check.py coverage/lcov.info --package tensor --only libtorch

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-tensor-torch
          path: tensor/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # A ggml Vulkan device on a runner that has no GPU: Mesa's software Vulkan (lavapipe, the llvmpipe device), which is
  # the device the pairing case of transformers/ runs on. The device is named, never inferred: VK_DRIVER_FILES points at
  # the lavapipe manifest alone, so no other driver can answer, and GGML_VK_VISIBLE_DEVICES=0 selects it because ggml
  # leaves out a device of type CPU unless it is asked for by index. TENSOR_REQUIRE_VULKAN=1 turns a run without a device
  # into a failure instead of a case that runs nowhere; the loader's own summary, under that same VK_DRIVER_FILES, names
  # the software device and must name no card driver; and the step asserts the two PASS lines of the case, so a run that
  # skipped it or never paired is not a green run. Only that
  # case runs here: the software device interprets shaders (about twenty times the CPU engine on these fixtures), and the
  # packages and ggml-arm64 jobs keep the suites. The engine is the Vulkan build of tensor/tools/build-engine.sh; the
  # packages it needs are the ones that script names when they are missing (libvulkan-dev, glslc, spirv-headers) plus the
  # device and the loader (mesa-vulkan-drivers, libvulkan1) and vulkan-tools for the summary in the log.
  vulkan:
    needs: plan
    if: needs.plan.outputs.vulkan == 'true'
    name: ggml-vulkan (transformers)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      AGENTICA_ML_CACHE: /home/runner/.cache/agentica-ml
      GGML_VK_VISIBLE_DEVICES: '0'
    defaults:
      run:
        working-directory: transformers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Read the pinned Agentica version
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          read -r version sha256 _ < AGENTICA_VERSION
          [ -n "$version" ] && [ -n "$sha256" ] || {
            echo "AGENTICA_VERSION must hold the version and the sha256 of its linux-x86_64 archive" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ steps.pin.outputs.version }}
          sha256: ${{ steps.pin.outputs.sha256 }}

      - name: Install Mesa's software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libvulkan-dev glslc spirv-headers vulkan-tools

      # The manifest's file name changes across Mesa versions (lvp_icd.json, lvp_icd.x86_64.json): find it and fail when
      # the package brought none, rather than assume the name.
      - name: Name the software Vulkan device
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1)
          [ -n "$manifest" ] || {
            echo "no Lavapipe manifest under /usr/share/vulkan/icd.d: mesa-vulkan-drivers brings it" >&2
            exit 1
          }
          echo "VK_DRIVER_FILES=$manifest" >> "$GITHUB_ENV"
          echo "software Vulkan device: $manifest"

      - name: Name the engine pin
        id: engine-pin
        shell: bash
        run: |
          mkdir -p ~/.cache/agentica-ml
          echo "ggml=$(git rev-parse HEAD:third_party/ggml)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/agentica-ml
          key: engine-vulkan-${{ steps.engine-pin.outputs.ggml }}-${{ hashFiles('tensor/tools/build-engine.sh') }}

      # The Vulkan build of ggml (CPU and Vulkan backends in one library): the script builds it and prints the include
      # and library exports that the native module of tensor/ compiles against.
      - name: Build the pinned ggml engine with Vulkan
        shell: bash
        run: |
          set -euo pipefail
          exports=$(sh ../tensor/tools/build-engine.sh vulkan | grep '^export ') || true
          [ -n "$exports" ] || {
            echo "tensor/tools/build-engine.sh vulkan printed no export lines" >&2
            exit 1
          }
          eval "$exports"
          echo "C_INCLUDE_PATH=$C_INCLUDE_PATH" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install the locked dependencies
        run: agentica install

      # The device the loader offers, before any test: the software one, whatever the image also ships. This is the
      # device evidence of the job: `agentica test` keeps a test's own output to itself, so ggml's device line is not in
      # the test log, and the loader restricted to the lavapipe manifest is what makes the test's Vulkan(0) the software
      # device.
      - name: The device Vulkan offers
        shell: bash
        run: |
          set -euo pipefail
          vulkaninfo --summary | tee "$RUNNER_TEMP/vulkaninfo.txt"
          grep -qi "llvmpipe" "$RUNNER_TEMP/vulkaninfo.txt"
          ! grep -qiE "radeon|radv" "$RUNNER_TEMP/vulkaninfo.txt"

      # The pairing case of transformers/ only, and its exact summary: the case fails on its own when the device is not
      # there (`TENSOR_REQUIRE_VULKAN`), when a row's ids are not its own singleton run on that device, or when the round
      # paired nothing; the greps keep a filtered-out or shortened run from passing. pipefail keeps the test's status.
      - name: Test the paired step on the software Vulkan device
        env:
          TENSOR_REQUIRE_VULKAN: '1'
        shell: bash
        run: |
          set -euo pipefail
          agentica test --max-steps 10000000 test/vulkan_pair_test.agc 2>&1 | tee "$RUNNER_TEMP/vulkan.log"
          grep -q "2 passed, 0 failed, 0 skipped, 0 not executed, 0 file errors" "$RUNNER_TEMP/vulkan.log"
          grep -q "PASS .*vulkan_pair_test.agc / a paired step on vulkan gives the rows singleton ids" "$RUNNER_TEMP/vulkan.log"
          grep -q "PASS .*vulkan_pair_test.agc / a serving round pairs on vulkan" "$RUNNER_TEMP/vulkan.log"

  # The ggml engine of tensor/ on linux-arm64 (GitHub's ubuntu-26.04-arm, the architecture of AWS Graviton): the pinned
  # ggml built by tools/build-engine.sh for the CPU the runner has, and the whole suite of tensor/ and of transformers/
  # (the models, Qwen3 among them, on Backend.Ggml) with TENSOR_REQUIRE_GGML=1, so an engine that did not build fails the
  # ggml tests instead of passing them as absent. The Agentica archive is the linux-arm64 one: its sha256 is the third
  # column of the package's AGENTICA_VERSION (the second is the x86_64 one).
  ggml-arm64:
    needs: plan
    if: needs.plan.outputs.ggml_arm64 == 'true'
    name: ggml-arm64 (${{ matrix.package }})
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [tensor, transformers]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Read the pinned Agentica version
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          read -r version _ sha256 < AGENTICA_VERSION
          [ -n "$version" ] && [ -n "$sha256" ] || {
            echo "AGENTICA_VERSION must hold the version, the sha256 of its linux-x86_64 archive and the sha256 of its linux-arm64 one" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ steps.pin.outputs.version }}
          sha256: ${{ steps.pin.outputs.sha256 }}

      - name: Build the pinned ggml
        shell: bash
        run: |
          set -euo pipefail
          exports=$(sh tools/build-engine.sh | grep '^export ')
          eval "$exports"
          echo "C_INCLUDE_PATH=$C_INCLUDE_PATH" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install the locked dependencies
        run: agentica install

      - name: Test
        env:
          TENSOR_REQUIRE_GGML: '1'
        run: agentica test --max-steps 10000000

  # The XLA backend of tensor/ on linux-arm64 (ubuntu-26.04-arm): the aarch64 plugin of our release xla-<commit>, which
  # tools/install_xla.agc downloads and checks by its sha256 as in the xla job, and the same XLA tests of tensor/ with
  # TENSOR_REQUIRE_XLA=1, so a plugin that is missing or does not load fails them instead of skipping. The Agentica
  # archive is the linux-arm64 one (third column of tensor/AGENTICA_VERSION).
  xla-arm64:
    needs: plan
    if: needs.plan.outputs.xla == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    env:
      AGENTICA_ML_CACHE: /home/runner/.cache/agentica-ml
    defaults:
      run:
        working-directory: tensor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the pinned Agentica version
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          read -r version _ sha256 < AGENTICA_VERSION
          [ -n "$version" ] && [ -n "$sha256" ] || {
            echo "AGENTICA_VERSION must hold the version, the sha256 of its linux-x86_64 archive and the sha256 of its linux-arm64 one" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ steps.pin.outputs.version }}
          sha256: ${{ steps.pin.outputs.sha256 }}

      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: /home/runner/.cache/agentica-ml/xla
          key: xla-plugin-arm64-${{ hashFiles('tensor/src/xla.agc') }}

      - name: Install the locked dependencies
        run: agentica install

      - name: Install the XLA plugin
        run: agentica tools/install_xla.agc

      - name: Test
        env:
          TENSOR_REQUIRE_XLA: '1'
        run: agentica test --max-steps 10000000 test/xla_test.agc test/xla_ops_test.agc test/xla_half_test.agc test/xla_bf16_test.agc test/xla_missing_test.agc test/from_file_test.agc

      - name: Test the Agentica read path of from_file on XLA
        env:
          TENSOR_LOAD: agentica
          TENSOR_REQUIRE_XLA: '1'
        run: agentica test --max-steps 10000000 test/from_file_test.agc test/xla_half_test.agc test/xla_bf16_test.agc

  # The libtorch backend of tensor/ on linux-arm64, as the torch job: Ubuntu's libtorch-dev (not in 24.04, so the
  # runner is 26.04), tools/build-torch.sh, the optional native module built by `agentica install`, and the tensor suite
  # with TENSOR_REQUIRE_TORCH=1. The Agentica archive is the linux-arm64 one (third column of tensor/AGENTICA_VERSION).
  torch-arm64:
    needs: plan
    if: needs.plan.outputs.torch == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tensor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the pinned Agentica version
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          read -r version _ sha256 < AGENTICA_VERSION
          [ -n "$version" ] && [ -n "$sha256" ] || {
            echo "AGENTICA_VERSION must hold the version, the sha256 of its linux-x86_64 archive and the sha256 of its linux-arm64 one" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ steps.pin.outputs.version }}
          sha256: ${{ steps.pin.outputs.sha256 }}

      - name: Install libtorch
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtorch-dev
          dpkg-query -W -f='libtorch-dev ${Version}\n' libtorch-dev

      - name: Find libtorch
        shell: bash
        run: |
          set -euo pipefail
          exports=$(sh tools/build-torch.sh | grep '^export ')
          eval "$exports"
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$CPLUS_INCLUDE_PATH" >> "$GITHUB_ENV"

      - name: Install the locked dependencies
        run: agentica install

      - name: Test
        env:
          TENSOR_REQUIRE_TORCH: '1'
        run: agentica test --max-steps 10000000

  # `test` is the required check, so it carries the result of the other jobs.
  test:
    needs: [plan, packages, cchecker, xla, torch, vulkan, ggml-arm64, xla-arm64, torch-arm64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check that the other jobs passed
        env:
          PLAN: ${{ needs.plan.result }}
          PACKAGES: ${{ needs.packages.result }}
          CCHECKER: ${{ needs.cchecker.result }}
          XLA: ${{ needs.xla.result }}
          TORCH: ${{ needs.torch.result }}
          VULKAN: ${{ needs.vulkan.result }}
          GGML_ARM64: ${{ needs.ggml-arm64.result }}
          XLA_ARM64: ${{ needs.xla-arm64.result }}
          TORCH_ARM64: ${{ needs.torch-arm64.result }}
        run: |
          echo "plan: $PLAN, packages: $PACKAGES, cchecker: $CCHECKER, xla: $XLA, torch: $TORCH, vulkan: $VULKAN, ggml-arm64: $GGML_ARM64, xla-arm64: $XLA_ARM64, torch-arm64: $TORCH_ARM64"
          [ "$PLAN" = success ] && [[ "$PACKAGES" =~ ^(success|skipped)$ ]] && [ "$CCHECKER" = success ] &&
            [[ "$XLA" =~ ^(success|skipped)$ ]] && [[ "$TORCH" =~ ^(success|skipped)$ ]] &&
            [[ "$VULKAN" =~ ^(success|skipped)$ ]] &&
            [[ "$GGML_ARM64" =~ ^(success|skipped)$ ]] && [[ "$XLA_ARM64" =~ ^(success|skipped)$ ]] &&
            [[ "$TORCH_ARM64" =~ ^(success|skipped)$ ]]
