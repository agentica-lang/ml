name: XLA plugin

# Builds the XLA PJRT CPU plugin (pjrt_c_api_cpu_plugin.so) from openxla/xla
# at the commit pinned in tensor/xla-commit, for Linux x86_64 and aarch64, and
# uploads each as an artifact with its header and the licenses of what it
# links. No official prebuilt of the plugin comes with a license, so this is
# where ours comes from.
# Pushing the tag xla-<the first 12 characters of the pinned commit> also
# publishes a GitHub Release on that tag: both plugins, the header, the
# licenses and SHA256SUMS, which tensor/tools/install_xla.agc downloads. The
# run fails when the tag does not match the pin, when the tag is not on a
# commit of main, or when a release of the tag exists. A run by hand
# (workflow_dispatch) on a branch builds and publishes nothing; to try another
# XLA commit, run it from a branch that changes tensor/xla-commit. A run by
# hand on the tag itself (to resume an unfinished run) publishes like the push.
# The build takes hours. The release is made as a draft, filled, then
# published, so a failed run leaves no half release; a re-run replaces the
# draft of the tag and never a published release.
# A run that does not finish (time limit, failure, cancel) uploads its Bazel
# disk cache as an artifact kept 3 days, one per platform; a new run given
# that run's id in `resume_run_id` (a run of this workflow) starts from it. The cache of GitHub Actions
# is not used, so this workflow never evicts what ci.yml caches.
on:
  push:
    tags:
      - 'xla-*'
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Run id of an unfinished run of this workflow, to start from its Bazel disk cache (optional)
        required: false
        default: ''

# actions: read lets a run download the disk cache artifact of an earlier run.
# Only the publish job may write.
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  XLA_TARGET: //xla/pjrt/c:pjrt_c_api_cpu_plugin.so
  # Bazelisk reads XLA's .bazelversion and downloads that Bazel.
  BAZELISK_VERSION: v1.30.0

jobs:
  # Reads the pin and checks the tag against it before any hour is spent.
  pin:
    name: Pinned XLA commit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the pin and check the tag
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          commit=$(tr -d '[:space:]' < tensor/xla-commit)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "tensor/xla-commit must hold a full 40-character SHA" >&2
            exit 1
          }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "xla-${commit:0:12}" ] || {
              echo "the tag $GITHUB_REF_NAME does not match tensor/xla-commit: expected xla-${commit:0:12}" >&2
              exit 1
            }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "the tag $GITHUB_REF_NAME is not on a commit of main" >&2
              exit 1
            }
            # A draft is not seen here (and the publish job replaces it); a
            # published release is never replaced.
            if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>&1); then
              echo "a release of $GITHUB_REF_NAME exists already" >&2
              exit 1
            elif ! grep -q 'Not Found' <<< "$out"; then
              echo "$out" >&2
              exit 1
            fi
          fi
          # The cache of an earlier run is used only when that run is of this
          # workflow in this repository.
          if [ -n "$RESUME_RUN_ID" ]; then
            [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]] || {
              echo "resume_run_id must be a run id (digits)" >&2
              exit 1
            }
            name=$(gh run view "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName --jq .workflowName)
            [ "$name" = "$GITHUB_WORKFLOW" ] || {
              echo "run $RESUME_RUN_ID is of the workflow '$name', not '$GITHUB_WORKFLOW'" >&2
              exit 1
            }
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    name: pjrt_c_api_cpu_plugin.so (linux ${{ matrix.arch }})
    needs: pin
    runs-on: ${{ matrix.runner }}
    # The GitHub limit. The build step stops itself earlier, so the disk
    # cache is still uploaded.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # bazelisk_sha256 is that of the Bazelisk release file; bazel_sha256
          # is that of bazel-8.8.2-linux-<arch>, the version in XLA's
          # .bazelversion at the pinned commit (Bazelisk checks the Bazel it
          # downloads against it). A commit with another Bazel version needs
          # its values here.
          - arch: x86_64
            runner: ubuntu-26.04
            bazelisk_file: bazelisk-linux-amd64
            bazelisk_sha256: a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8
            bazel_sha256: bf463ba0f5f782e8fe31071bd2b821c2f6a27f03e5bb62f0879e88cbf3656e04
            loader: ld-linux-x86-64.so.2
            bazel_config: --config=avx_linux
            platform: linux x86_64, needs a CPU with AVX (--config=avx_linux)
          - arch: aarch64
            runner: ubuntu-26.04-arm
            bazelisk_file: bazelisk-linux-arm64
            bazelisk_sha256: b2bcc040c213b44586b121bda6d983c35df121b917c3a7a66fb16f2fa0df1a4f
            bazel_sha256: de0392a89e69db64a5070fa6c97acc70c169f5cb98a0e2e1ae0cd2b5f1c5264d
            loader: ld-linux-aarch64.so.1
            bazel_config: --config=linux_arm64
            platform: linux aarch64, ARMv8-A (--config=linux_arm64)
    env:
      XLA_COMMIT: ${{ needs.pin.outputs.commit }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      ARCH: ${{ matrix.arch }}
      BAZELISK_FILE: ${{ matrix.bazelisk_file }}
      BAZELISK_SHA256: ${{ matrix.bazelisk_sha256 }}
      BAZELISK_VERIFY_SHA256: ${{ matrix.bazel_sha256 }}
      BAZEL_ARCH_CONFIG: ${{ matrix.bazel_config }}
      LOADER: ${{ matrix.loader }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check the inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          [[ "$XLA_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "the pinned XLA commit must be a full 40-character SHA" >&2
            exit 1
          }
          [[ "$RESUME_RUN_ID" =~ ^[0-9]*$ ]] || {
            echo "resume_run_id must be a run id (digits)" >&2
            exit 1
          }

      # The runner starts with about 14 GB free; the Bazel output tree of XLA
      # and LLVM needs more. Bazel's output and the disk cache go where there
      # is more room: /mnt, when the runner has that disk, or the home folder.
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache
          df -h / /mnt || true
          work=$HOME/xla-work
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail / | tail -1)" ]; then
            work=/mnt/xla-work
            sudo mkdir -p "$work"
            sudo chown "$(id -u):$(id -g)" "$work"
          fi
          mkdir -p "$work/disk-cache" "$work/bazel"
          echo "XLA_WORK=$work" >> "$GITHUB_ENV"
          echo "Bazel output and disk cache: $work"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ml
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: openxla/xla
          ref: ${{ env.XLA_COMMIT }}
          path: xla
          persist-credentials: false

      - name: Install Bazelisk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/$BAZELISK_VERSION/$BAZELISK_FILE"
          echo "$BAZELISK_SHA256  $RUNNER_TEMP/bin/bazel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/bazel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # XLA's configure step writes xla_configure.bazelrc, which its .bazelrc
      # imports. On Linux the CPU build is hermetic: Bazel downloads the Clang,
      # libc++ and sysroot that XLA pins (rules_ml_toolchain), so no compiler
      # of the runner is used. Our flags go in the same file, so the build and
      # the queries after it share one configuration.
      - name: Configure XLA for CPU
        working-directory: xla
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$XLA_COMMIT" ]
          # Only a commit of XLA's main is built. The checkout is shallow at
          # the commit, so this fetches the commits of main without their files.
          git fetch -q --filter=tree:0 origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$XLA_COMMIT" origin/main || {
            echo "$XLA_COMMIT is not a commit of openxla/xla main" >&2
            exit 1
          }
          [ "$(bazel --version)" = "bazel $(cat .bazelversion)" ]
          python3 configure.py --backend=CPU
          cat >> xla_configure.bazelrc <<EOF
          startup --output_user_root=$XLA_WORK/bazel
          build --compilation_mode=opt
          build $BAZEL_ARCH_CONFIG
          build --strip=always
          build --jobs=4
          build --local_ram_resources=12288
          build --disk_cache=$XLA_WORK/disk-cache
          build --verbose_failures
          EOF
          cat xla_configure.bazelrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.RESUME_RUN_ID != ''
        continue-on-error: true
        id: resume
        with:
          name: xla-disk-cache-${{ env.XLA_COMMIT }}-${{ env.ARCH }}
          run-id: ${{ env.RESUME_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ env.XLA_WORK }}/resume

      - name: Unpack the disk cache of the earlier run
        if: steps.resume.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          tar --zstd -xf "$XLA_WORK/resume/disk-cache.tar.zst" -C "$XLA_WORK"
          rm -rf "$XLA_WORK/resume"
          du -sh "$XLA_WORK/disk-cache"

      # SIGINT at minute 290 of the job lets Bazel stop cleanly, with time
      # left to upload the disk cache inside the 360 minutes.
      - name: Build the plugin
        id: build
        working-directory: xla
        timeout-minutes: 300
        shell: bash
        run: |
          set -euo pipefail
          left=$((290 * 60 - ($(date +%s) - JOB_START)))
          [ "$left" -gt 0 ]
          timeout --signal=INT --kill-after=300 "${left}s" bazel build "$XLA_TARGET"
          df -h

      - name: Collect the plugin and its header
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          cp xla/bazel-bin/xla/pjrt/c/pjrt_c_api_cpu_plugin.so out/
          chmod u+w out/pjrt_c_api_cpu_plugin.so
          strip --strip-unneeded out/pjrt_c_api_cpu_plugin.so
          cp xla/xla/pjrt/c/pjrt_c_api.h out/
          exported=$(nm -D --defined-only out/pjrt_c_api_cpu_plugin.so)
          grep -q ' GetPjrtApi' <<< "$exported"
          # The plugin may need only glibc: anything else would have to ship
          # with it.
          needed=$(readelf -d out/pjrt_c_api_cpu_plugin.so | awk '/NEEDED/ { gsub(/[\[\]]/, "", $NF); print $NF }')
          while read -r lib; do
            case "$lib" in
              libc.so.6 | libm.so.6 | libdl.so.2 | libpthread.so.0 | librt.so.1 | "$LOADER") ;;
              *) echo "the plugin needs $lib, which is not part of glibc" >&2; exit 1 ;;
            esac
          done <<< "$needed"
          symbols=$(objdump -T out/pjrt_c_api_cpu_plugin.so)
          glibc=$(grep -o 'GLIBC_[0-9.]*' <<< "$symbols" | sort -u -V | tail -1)
          [ -n "$glibc" ]
          major=$(awk '$1 == "#define" && $2 == "PJRT_API_MAJOR" { print $3 }' out/pjrt_c_api.h)
          minor=$(awk '$1 == "#define" && $2 == "PJRT_API_MINOR" { print $3 }' out/pjrt_c_api.h)
          [ -n "$major" ] && [ -n "$minor" ]
          {
            echo "xla_commit: $XLA_COMMIT"
            echo "pjrt_api_version: $major.$minor"
            echo "target: $XLA_TARGET"
            echo "platform: $PLATFORM"
            echo "glibc: needs ${glibc#GLIBC_} or newer"
            echo "bazel: $(cat xla/.bazelversion)"
            echo "built_by: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "ml_commit: $GITHUB_SHA"
            echo
            echo "xla_configure.bazelrc:"
            sed 's/^/  /' xla/xla_configure.bazelrc
            echo
            echo "shared libraries the plugin needs:"
            sed 's/^/  /' <<< "$needed"
          } > out/BUILD-INFO.txt
          cat out/BUILD-INFO.txt
          ls -l out

      # The smoke program checks the version the plugin reports against the
      # header, then creates and destroys a CPU client.
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -I out ml/tensor/tools/xla/smoke.c -ldl -o "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke" "$PWD/out/pjrt_c_api_cpu_plugin.so"

      # A missing license does not stop the upload: the last step fails the
      # job, and the artifact shows what was found.
      - name: Collect the licenses
        id: licenses
        continue-on-error: true
        shell: bash
        run: bash ml/tensor/tools/xla/collect-licenses.sh xla out

      - name: Write the checksums
        shell: bash
        run: |
          set -euo pipefail
          cd out
          find . -type f ! -name sha256sums.txt -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > sha256sums.txt
          cat sha256sums.txt
          df -h

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: xla-pjrt-cpu-plugin-linux-${{ env.ARCH }}-${{ env.XLA_COMMIT }}
          path: out
          retention-days: 90
          if-no-files-found: error

      - name: Fail when a license is missing
        if: steps.licenses.outcome == 'failure'
        shell: bash
        run: |
          echo "collect-licenses.sh failed: see its step and licenses/MISSING.txt in the artifact" >&2
          exit 1

      # Last, and only when the job did not succeed: the next run starts from
      # this with resume_run_id. One file uploads faster than the many small
      # ones of the cache.
      - name: Pack the disk cache
        id: pack
        if: always() && steps.build.conclusion != 'skipped' && job.status != 'success'
        shell: bash
        run: |
          set -euo pipefail
          df -h
          tar --zstd --remove-files -cf "$XLA_WORK/disk-cache.tar.zst" -C "$XLA_WORK" disk-cache
          ls -l "$XLA_WORK/disk-cache.tar.zst"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.pack.outcome == 'success'
        with:
          overwrite: true
          name: xla-disk-cache-${{ env.XLA_COMMIT }}-${{ env.ARCH }}
          path: ${{ env.XLA_WORK }}/disk-cache.tar.zst
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  # The same build on macOS arm64, never tried before: a failure here must not
  # stop the Linux release, so the job continues on error and the publish job
  # takes what was built. Only what differs from the Linux job has its own
  # comments. Apple's Clang and SDK build it (XLA's CPU build is not hermetic
  # on macOS), and the dylib may link only what ships with macOS.
  build-macos:
    name: pjrt_c_api_cpu_plugin.dylib (macos arm64, experimental)
    needs: pin
    runs-on: macos-26
    continue-on-error: true
    # Shorter than the Linux jobs: the build stops itself at minute 150, with
    # the rest left for the cache upload.
    timeout-minutes: 180
    env:
      XLA_COMMIT: ${{ needs.pin.outputs.commit }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      BAZELISK_SHA256: 555d2ff912ccd336d0060bdb5251ef2f62629c6f8fbadb59005a45d5625793ec
      BAZELISK_VERIFY_SHA256: ae640432a3fdb8a08c637562895f91c7ff1f63f04b1a9d34de9e9c46162bc10b
    steps:
      - name: Check the inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          [[ "$XLA_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "the pinned XLA commit must be a full 40-character SHA" >&2
            exit 1
          }
          [[ "$RESUME_RUN_ID" =~ ^[0-9]*$ ]] || {
            echo "resume_run_id must be a run id (digits)" >&2
            exit 1
          }
          # gtimeout stops the build in time for the cache to be uploaded.
          brew install coreutils zstd
          work=$HOME/xla-work
          mkdir -p "$work/disk-cache" "$work/bazel"
          echo "XLA_WORK=$work" >> "$GITHUB_ENV"
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ml
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: openxla/xla
          ref: ${{ env.XLA_COMMIT }}
          path: xla
          persist-credentials: false

      - name: Install Bazelisk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/$BAZELISK_VERSION/bazelisk-darwin-arm64"
          echo "$BAZELISK_SHA256  $RUNNER_TEMP/bin/bazel" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/bin/bazel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Configure XLA for CPU
        working-directory: xla
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$XLA_COMMIT" ]
          git fetch -q --filter=tree:0 origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$XLA_COMMIT" origin/main || {
            echo "$XLA_COMMIT is not a commit of openxla/xla main" >&2
            exit 1
          }
          [ "$(bazel --version)" = "bazel $(cat .bazelversion)" ]
          python3 configure.py --backend=CPU
          cat >> xla_configure.bazelrc <<EOT
          startup --output_user_root=$XLA_WORK/bazel
          build --compilation_mode=opt
          build --config=macos_arm64
          build --strip=always
          build --jobs=3
          build --local_ram_resources=6144
          build --disk_cache=$XLA_WORK/disk-cache
          build --verbose_failures
          EOT
          cat xla_configure.bazelrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.RESUME_RUN_ID != ''
        continue-on-error: true
        id: resume
        with:
          name: xla-disk-cache-${{ env.XLA_COMMIT }}-macos-arm64
          run-id: ${{ env.RESUME_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ env.XLA_WORK }}/resume

      - name: Unpack the disk cache of the earlier run
        if: steps.resume.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          zstd -dc "$XLA_WORK/resume/disk-cache.tar.zst" | tar -xf - -C "$XLA_WORK"
          rm -rf "$XLA_WORK/resume"
          du -sh "$XLA_WORK/disk-cache"

      - name: Build the plugin
        id: build
        working-directory: xla
        timeout-minutes: 160
        shell: bash
        run: |
          set -euo pipefail
          left=$((150 * 60 - ($(date +%s) - JOB_START)))
          [ "$left" -gt 0 ]
          gtimeout --signal=INT --kill-after=300 "${left}s" bazel build "$XLA_TARGET"
          df -h /

      # The Mach-O file is named .so by the target; ours is a .dylib. strip
      # invalidates the signature, and an arm64 binary needs one, so it is
      # signed ad hoc after.
      - name: Collect the plugin and its header
        shell: bash
        run: |
          set -euo pipefail
          plugin=out/pjrt_c_api_cpu_plugin.dylib
          mkdir out
          cp xla/bazel-bin/xla/pjrt/c/pjrt_c_api_cpu_plugin.so "$plugin"
          chmod u+w "$plugin"
          strip -x "$plugin"
          codesign --force --sign - "$plugin"
          cp xla/xla/pjrt/c/pjrt_c_api.h out/
          [ "$(lipo -archs "$plugin")" = arm64 ]
          nm -gU "$plugin" | grep -q ' _GetPjrtApi$'
          # The plugin may need only what ships with macOS; its own install
          # name is not a need.
          id=$(otool -D "$plugin" | tail -n +2)
          [ -n "$id" ]
          needed=$(otool -L "$plugin" | tail -n +2 | awk '{ print $1 }' | grep -vxF -- "$id" || true)
          [ -n "$needed" ]
          while read -r lib; do
            case "$lib" in
              /usr/lib/* | /System/Library/*) ;;
              *) echo "the plugin needs $lib, which is not part of macOS" >&2; exit 1 ;;
            esac
          done <<< "$needed"
          minos=$(vtool -show-build "$plugin" | awk '$1 == "minos" { print $2 }')
          [ -n "$minos" ]
          major=$(awk '$1 == "#define" && $2 == "PJRT_API_MAJOR" { print $3 }' out/pjrt_c_api.h)
          minor=$(awk '$1 == "#define" && $2 == "PJRT_API_MINOR" { print $3 }' out/pjrt_c_api.h)
          [ -n "$major" ] && [ -n "$minor" ]
          {
            echo "xla_commit: $XLA_COMMIT"
            echo "pjrt_api_version: $major.$minor"
            echo "target: $XLA_TARGET"
            echo "platform: macos arm64 (--config=macos_arm64), needs macOS $minos or newer"
            echo "bazel: $(cat xla/.bazelversion)"
            echo "built_by: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "ml_commit: $GITHUB_SHA"
            echo
            echo "xla_configure.bazelrc:"
            sed 's/^/  /' xla/xla_configure.bazelrc
            echo
            echo "shared libraries the plugin needs:"
            sed 's/^/  /' <<< "$needed"
          } > out/BUILD-INFO.txt
          cat out/BUILD-INFO.txt
          ls -l out

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -I out ml/tensor/tools/xla/smoke.c -o "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke" "$PWD/out/pjrt_c_api_cpu_plugin.dylib"

      # Unlike the Linux job, the artifact is uploaded only when the licenses
      # are complete: nothing of macOS is published without them.
      - name: Collect the licenses
        shell: bash
        run: bash ml/tensor/tools/xla/collect-licenses.sh xla out

      - name: Write the checksums
        shell: bash
        run: |
          set -euo pipefail
          cd out
          find . -type f ! -name sha256sums.txt | sed 's#^\./##' | LC_ALL=C sort | while IFS= read -r f; do shasum -a 256 "$f"; done > sha256sums.txt
          cat sha256sums.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: xla-pjrt-cpu-plugin-macos-arm64-${{ env.XLA_COMMIT }}
          path: out
          retention-days: 90
          if-no-files-found: error

      - name: Pack the disk cache
        id: pack
        if: always() && steps.build.conclusion != 'skipped' && job.status != 'success'
        shell: bash
        run: |
          set -euo pipefail
          tar -cf - -C "$XLA_WORK" disk-cache | zstd -T0 -3 -o "$XLA_WORK/disk-cache.tar.zst"
          ls -l "$XLA_WORK/disk-cache.tar.zst"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.pack.outcome == 'success'
        with:
          overwrite: true
          name: xla-disk-cache-${{ env.XLA_COMMIT }}-macos-arm64
          path: ${{ env.XLA_WORK }}/disk-cache.tar.zst
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  # Only on a tag (pushed, or a run by hand on it), after both Linux builds. The macOS build is taken
  # when its artifact exists, and the notes say when it is not there. The only
  # job that may write.
  publish:
    name: GitHub Release
    needs: [pin, build, build-macos]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      XLA_COMMIT: ${{ needs.pin.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: xla-pjrt-cpu-plugin-*-${{ env.XLA_COMMIT }}
          path: artifacts

      - name: Assemble the release
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          have=()
          # <platform> <extension> <required: yes or no>
          for entry in "linux-x86_64 so yes" "linux-aarch64 so yes" "macos-arm64 dylib no"; do
            read -r platform ext required <<< "$entry"
            dir=artifacts/xla-pjrt-cpu-plugin-$platform-$XLA_COMMIT
            if [ ! -d "$dir" ]; then
              [ "$required" = no ] || { echo "$dir is missing" >&2; exit 1; }
              continue
            fi
            have+=("$platform")
            (cd "$dir" && sha256sum -c --quiet sha256sums.txt)
            cp "$dir/pjrt_c_api_cpu_plugin.$ext" "release/pjrt_c_api_cpu_plugin-$platform.$ext"
            cp "$dir/BUILD-INFO.txt" "release/BUILD-INFO-$platform.txt"
            [ -f "$dir/licenses/MISSING.txt" ] && [ -f "$dir/LICENSE" ] || { echo "$dir has no licenses" >&2; exit 1; }
            tar -czf "release/licenses-$platform.tar.gz" -C "$dir" LICENSE licenses
            # One header: every build is of the same commit.
            if [ -f release/pjrt_c_api.h ]; then
              cmp "$dir/pjrt_c_api.h" release/pjrt_c_api.h
            else
              cp "$dir/pjrt_c_api.h" release/pjrt_c_api.h
            fi
          done
          {
            echo "The PJRT CPU plugin of openxla/xla at commit $XLA_COMMIT, built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
            echo "It is under the Apache License 2.0; the licenses of what it links are in licenses-*.tar.gz. Check the files with SHA256SUMS."
            echo
            echo "Platforms: ${have[*]}"
            case " ${have[*]} " in
              *" macos-arm64 "*) ;;
              *) echo "macos-arm64 was not built in this run (the macOS build is experimental): see the run." ;;
            esac
          } > notes.md
          cat notes.md
          (cd release && find . -type f ! -name SHA256SUMS | sed 's#^\./##' | LC_ALL=C sort | xargs -d '\n' sha256sum > SHA256SUMS && cat SHA256SUMS)
          ls -l release

      # The release is a draft until every file is in it. The tag must still
      # be the commit this run built, and only a draft of an earlier run of
      # this tag is replaced.
      - name: Create the release
        shell: bash
        run: |
          set -euo pipefail
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)" = "$GITHUB_SHA" ] || {
            echo "the tag $GITHUB_REF_NAME no longer points at $GITHUB_SHA" >&2
            exit 1
          }
          drafts() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id"
          }
          for id in $(drafts); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --latest=false \
            --title "XLA PJRT CPU plugin ($GITHUB_REF_NAME)" \
            --notes-file notes.md
          id=$(drafts)
          [ -n "$id" ] && [ "$(wc -w <<< "$id")" -eq 1 ]
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=false
