name = "train"
agentica = "0.38.0"

# Every bare `end` is followed by an empty line (AGENTS.md).
[style]
blank_line_after_end = true

[dependencies]
tensor = { git = "https://github.com/agentica-lang/ml", tag = "tensor-0.4.0", subdir = "tensor" }
hub = { git = "https://github.com/agentica-lang/ml", tag = "hub-0.4.0", subdir = "hub" }
nn = { git = "https://github.com/agentica-lang/ml", tag = "nn-0.4.0", subdir = "nn" }
prop = { git = "https://github.com/agentica-lang/packages", tag = "prop-0.4.2", subdir = "prop", group = "test" }
