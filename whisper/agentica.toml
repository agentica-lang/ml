name = "whisper"
agentica = "0.35.0"

# Every bare `end` is followed by an empty line (AGENTS.md).
[style]
blank_line_after_end = true

# The header of the `extern module` block of whisper.agc, made with native-gen
# (see its header comment); `build` compiles the thin C layer, which answers
# error until whisper.cpp is linked.
[native.whisper]
build = { sources = ["native/whisper.c"] }
