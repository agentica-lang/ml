name = "torch"
agentica = "0.35.0"

# Every bare `end` is followed by an empty line (AGENTS.md).
[style]
blank_line_after_end = true

# `tensor/` is this repository's package (a monorepo member), taken by path: a
# `path` in a package manifest is the root manifest's to write, and this folder
# is its own root when `agentica` runs inside it. A fetched `torch` package
# needs the tag pin instead, which waits for `tensor-0.1.0` (README).
[dependencies]
tensor = { path = "../tensor" }
native-gen = { git = "https://github.com/agentica-lang/packages", tag = "native-gen-0.4.0", subdir = "native-gen" }

# The native side: the thin C++ layer over libtorch's C++ API. `optional`
# keeps the package usable where libtorch is not installed (the run warns and
# `Native.load("torch")` says no; `Torch.available()` is how a caller asks).
# The build table takes `.c` sources, `-D` defines and `-l` names and nothing
# else, so the C++ driver and libtorch's paths arrive through `CC`,
# `CPLUS_INCLUDE_PATH` and `LIBRARY_PATH` (see `tools/build-torch.sh`).
[native.torch]
optional = true
build = { sources = ["native/torch.c"], libs = ["torch", "torch_cpu", "c10", "stdc++", "m"] }
