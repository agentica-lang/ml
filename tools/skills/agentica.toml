name = "skills-check"
agentica = "0.38.0"

# Every bare `end` is followed by an empty line, as in the packages.
[style]
blank_line_after_end = true

# The packages as the skills tell an app to use them (an app writes their tags,
# see the install section of each skill), read from the folders of this
# repository. A folder is a `path`, which is not the source that the members
# name for each other (their tags), so each line is an `override`; the
# post-release check of `ml-release` installs the skills' tags instead.
# `whisper` is not a member and its engine is not built here: the examples
# import its WAV reader only, from its tag. A release of whisper moves this
# line to the new tag, after the tags exist.
[dependencies]
tensor = { path = "../../tensor", override = true }
nn = { path = "../../nn", override = true }
hub = { path = "../../hub", override = true }
train = { path = "../../train", override = true }
transformers = { path = "../../transformers", override = true }
asr = { path = "../../asr", override = true }
whisper = { git = "https://github.com/agentica-lang/ml", tag = "whisper-0.5.0", subdir = "whisper" }
