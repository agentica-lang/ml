name = "tensor"
agentica = "0.38.0"

# Every bare `end` is followed by an empty line (AGENTS.md).
[style]
blank_line_after_end = true

[dependencies]
agc-ir = { git = "https://github.com/agentica-lang/ml", tag = "agc-ir-0.1.0", subdir = "agc-ir" }
native-gen = { git = "https://github.com/agentica-lang/packages", tag = "native-gen-0.5.0", subdir = "native-gen" }
prop = { git = "https://github.com/agentica-lang/packages", tag = "prop-0.4.2", subdir = "prop", group = "test" }

# The libtorch backend's native side: a thin C++ layer over libtorch's C++ API,
# declared by the `extern module "torch"` of `src/native.agc` and dispatched to
# from the `Backend.Torch(device)` arms of `tensor.agc`
# (`tensor/DESIGN.md` §7).
#
# libtorch is a system dependency, never vendored and never downloaded by this
# repository: `tools/build-torch.sh` finds it and prints the exports this table
# cannot name. `optional` keeps the package usable where it is not installed —
# the run warns, `Tensor.available(Backend.Torch(..))` says no, and the Torch
# arm answers `error("backend not available")` instead of halting.
[native.torch]
optional = true
build = { sources = ["native/torch.c"], libs = ["torch", "torch_cpu", "c10", "stdc++", "m"] }

# The ggml backend's native side: a thin C layer over the pinned ggml
# submodule (`third_party/ggml`), declared by the `extern module "ggml"` of
# `src/ggml_native.agc` and dispatched to from the `Backend.Ggml(device)` arms
# of `tensor.agc` (`tensor/DESIGN.md` §7). `tools/build-engine.sh` builds ggml
# and writes `libtensor_ggml.a`, a linker script naming ggml's archives: the
# CPU tree's (CI), or the Vulkan tree's with ggml-vulkan and the loader.
# `optional`: without it `Tensor.available(Backend.Ggml(..))` says no.
[native.ggml]
optional = true
build = { sources = ["native/ggml.c", "native/ggml_graph.c"], libs = ["tensor_ggml", "stdc++", "m", "pthread"] }

# The XLA backend's native side: a thin C layer over the PJRT C API, declared by the `extern module "xla"` of
# `src/xla_native.agc` and dispatched to from the `Backend.Xla(device)` arms of `tensor.agc` (`tensor/DESIGN.md` §7).
# Nothing of XLA is linked: `native/xla.c` loads the plugin with `dlopen` at run time, from the ml cache where
# `tools/install_xla.agc` puts it. `native/pjrt_c_api.h` is the API's header (openxla/xla@dd6381370d6f, PJRT 0.81,
# Apache-2.0, its notice inside), vendored so the module builds with no download; a plugin that speaks a later minor
# (0.117 in the release xla-c9276de87e15) loads too.
[native.xla]
optional = true
build = { sources = ["native/xla.c"], libs = ["dl", "pthread"] }
