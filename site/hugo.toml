# The look, the layouts, the outputs and the highlighter come from the docs theme (themes/docs-theme, a submodule);
# `_merge = "deep"` takes its [outputs], [markup] and [minify] too. This file sets only what is the site's own.
# The pages of a package are its own files (README.md, DESIGN.md) and roadmap.md, mounted below, so the text has one
# home; site/content has the home page and a short section page per package.
_merge = "deep"
baseURL = "https://www.agentica-lang.com/ml/"
locale = "en"
title = "Agentica ML"
theme = "docs-theme"
disableKinds = ["taxonomy", "term", "rss"]
# The last commit of each page dates it in the sitemap (needs the whole history: fetch-depth 0 in pages.yml).
enableGitInfo = true

[module.hugoVersion]
  min = "0.167.0"

# No version: the packages have no releases yet.
[params]
  description = "Machine learning for Agentica: tensors, training and inference, in a functional style."
  repo = "https://github.com/agentica-lang/ml"
  branch = "main"
  repoPublic = true

# Plain quotes and dashes, as written in the Markdown (it is also what GitHub shows).
[markup.goldmark.extensions]
  typographer = false

# The mounted files are the packages' own, with no front matter, so the site gives them a title and an order.
[[cascade]]
  title = "Guide"
  weight = 1
  [cascade.target]
    path = "/*/guide"

[[cascade]]
  title = "Design"
  weight = 2
  [cascade.target]
    path = "/*/design"

[[cascade]]
  title = "Roadmap"
  weight = 7
  [cascade.target]
    path = "/roadmap"

# A mount of the site replaces Hugo's default for its target, so the content folder is listed too.
[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "../roadmap.md"
  target = "content/roadmap.md"

[[module.mounts]]
  source = "../tensor/README.md"
  target = "content/tensor/guide.md"

[[module.mounts]]
  source = "../tensor/DESIGN.md"
  target = "content/tensor/design.md"

[[module.mounts]]
  source = "../nn/DESIGN.md"
  target = "content/nn/design.md"

[[module.mounts]]
  source = "../train/DESIGN.md"
  target = "content/train/design.md"

[[module.mounts]]
  source = "../hub/DESIGN.md"
  target = "content/hub/design.md"

[[module.mounts]]
  source = "../asr/DESIGN.md"
  target = "content/asr/design.md"

[[module.mounts]]
  source = "../whisper/README.md"
  target = "content/whisper/guide.md"
