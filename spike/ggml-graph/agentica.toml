name = "ggml-graph-spike"
agentica = "0.37.0"

# Every bare `end` is followed by an empty line, as in the packages of this
# repository.
[style]
blank_line_after_end = true

# `tensor/`, `train/` and `hub/` (which `train/` needs) are read in place
# from this checkout (`path`, which only a root manifest may write): the spike
# lowers the graph `Trace` records today, not a pinned copy of it. `override`
# makes this `tensor` and this `hub` the ones `train` reads too.
[dependencies]
native-gen = { git = "https://github.com/agentica-lang/packages", tag = "native-gen-0.5.0", subdir = "native-gen" }
tensor = { path = "../../tensor", override = true }
train = { path = "../../train" }
hub = { path = "../../hub", override = true }

# A thin C layer over the pinned ggml submodule (`third_party/ggml`), built by
# `../ggml-vulkan/tools/build-ggml.sh`, whose exports name ggml's include and
# library folders. `optional` keeps the programs runnable without it: they say
# the module is unbuilt.
[native.ggmlgraph]
optional = true
build = { sources = ["native/ggmlgraph.c"], libs = ["ggml", "ggml-vulkan", "ggml-cpu", "ggml-base", "vulkan", "stdc++", "m", "pthread"] }
