name = "m0-spike"
agentica = "0.35.0"

# Every bare `end` is followed by an empty line, as in the packages of this
# repository.
[style]
blank_line_after_end = true

[dependencies]
native-gen = { git = "https://github.com/agentica-lang/packages", tag = "native-gen-0.4.0", subdir = "native-gen" }

# The native side: the C++ layer over libtorch's C++ API. `optional` keeps the
# spike runnable where libtorch is not installed (the run warns and
# `Native.load("torchspike")` says no, so `demo.agc` tells it plainly). The
# build table takes `.c` sources, `-D` defines and `-l` names and nothing
# else, so the C++ driver and libtorch's paths arrive through `CC`,
# `CPLUS_INCLUDE_PATH` and `LIBRARY_PATH` (see `tools/build-torch.sh` and
# README, "The native side").
[native.torchspike]
optional = true
build = { sources = ["native/torchspike.c"], libs = ["torch", "torch_cpu", "c10", "stdc++", "m"] }
