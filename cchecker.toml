# Settings of cchecker for the native C (`make cchecker`, the README); docs/settings.md of the release that
# tools/cchecker.sh pins describes every key. The lock helpers are marked in tensor/native/ggml_shared.h and ggml.c
# (CC_ACQUIRES, CC_RELEASES, CC_ACQUIRES_IF, CC_RELEASES_IF), the lock order (device lock, then cache_lock) as
# CC_LOCK_LEVEL, and ggml_Lease_free, a free hook that never waits for the device lock, is CC_SHORT.
#
# Accepted in cchecker-baseline.json:
# - CC-TIDY-CLANG-ANALYZER-CORE-NULLDEREFERENCE in tensor/native/ggml_graph.c (ggml_compile): a false positive. The loop
#   reads `t = j < 0 ? node : node->src[j]`, and the analyzer takes the test `t != NULL` for `node != NULL`. `node` comes
#   from ggml_graph_node(graph, i) with i below the node count, so it is never NULL. Left in the baseline and not
#   suppressed in the code, because the open PR that changes these lines (#47) would conflict.
# - CC-TIDY-BUGPRONE-SIZEOF-EXPRESSION in tensor/native/pjrt_c_api.h, 50 times: the vendored PJRT header (kept as it is)
#   measures each args struct with `sizeof(((T*)0)->last_field)` (PJRT_DEFINE_STRUCT_TRAITS), and the last field is a
#   pointer. That is the size the API means, not a mistake.
# - CC-GCC-ANALYZER-MALLOC-LEAK in tensor/native/ggml_graph.c (place), twice: a false positive. The two blocks that the
#   first `place` of a mixed graph makes are stored in the entry (`save_node`, `leaf_side` and the fields cut from them)
#   and freed with it (`destroy`); the analyzer does not follow the stores into the entry.
